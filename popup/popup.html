<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polyglots FR – demandes PTE</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Demandes PTE fr_FR</h1>
    <div class="actions">
      <button id="sort" type="button">⇅</button>
      <button id="refresh" type="button" title="Vérifier maintenant" aria-label="Vérifier maintenant">↻</button>
      <button id="options" type="button" title="Options" aria-label="Options">⚙</button>
    </div>
  </header>

  <div id="team-missing" class="banner" hidden>
    <p>Renseigne les pseudos WordPress.org de l’équipe FR dans <a id="team-missing-link" href="#">les réglages</a> : sans eux, une demande qui a déjà reçu une réponse reste dans la liste.</p>
  </div>
  <div id="update" class="banner" hidden></div>
  <div id="error" class="banner banner-error" role="alert" hidden></div>

  <p id="summary" class="summary" aria-live="polite">Chargement…</p>
  <div class="queue-row">
    <button id="queue-start" type="button" title="Ouvrir la file de réponse : les demandes s’ouvrent l’une après l’autre, réponse préremplie" hidden></button>
  </div>
  <ul id="list" class="list"></ul>
  <details id="ignored-box" class="ignored" hidden>
    <summary id="ignored-summary">Ignorées (0)</summary>
    <ul id="ignored-list" class="list"></ul>
  </details>

  <footer>
    <span id="checked"></span>
    <span>Projet communautaire, non officiel.</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
